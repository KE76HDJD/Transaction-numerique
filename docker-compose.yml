services:
  postgres:
    image: postgres:16
    container_name: transaction_postgres
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-transaction_db}
      POSTGRES_USER: ${DB_USER:-kevin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kevin123}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-kevin} -d ${DB_NAME:-transaction_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - transaction-net

networks:
  transaction-net:
    driver: bridge

volumes:
  pgdata:
