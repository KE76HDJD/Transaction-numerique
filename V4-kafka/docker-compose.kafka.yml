# ============================================
# V4 — Kafka Docker Compose
# ============================================
# Usage:
#   docker compose -f docker-compose.kafka.yml up -d --build
#   docker compose -f docker-compose.kafka.yml down
# ============================================

services:
  # --- Zookeeper ---
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: transaction-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: echo ruok | nc localhost 2181 | grep imok
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # --- Kafka Broker ---
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: transaction-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    healthcheck:
      test: kafka-broker-api-versions --bootstrap-server kafka:9092
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: always

  # --- Kafka UI ---
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: transaction-kafka-ui
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    restart: always

  # --- Producer ---
  kafka-producer:
    build:
      context: ./producer
    container_name: transaction-producer
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - .:/opt/app:ro
      - ../data:/opt/app/data:ro
    environment:
      KAFKA_BROKER: kafka:9092
      CSV_PATH: /opt/app/data/source/PS_20174392719_1491204439457_log.csv
    restart: "no"

  # --- Consumer ---
  kafka-consumer:
    build:
      context: ./consumer
    container_name: transaction-consumer
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - .:/opt/app:ro
    environment:
      KAFKA_BROKER: kafka:9092
      PG_HOST: host.docker.internal
      PG_PORT: "5434"
      PG_DB: transaction_db
      PG_USER: kevin
      PG_PASSWORD: kevin123
    restart: always
